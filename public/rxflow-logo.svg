<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <!-- Aesthetic White to Cyan/Emerald Gradient for Brand Text -->
    <linearGradient id="rxLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="rxSwooshGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- Rx Calligraphic Lettering -->
    <!-- Large Italic Calligraphy R -->
    <path d="M 65 132 C 55 110 50 75 78 50 C 105 28 152 28 174 55 C 190 78 175 110 142 122 L 192 168 C 198 173 204 178 186 178 C 170 178 154 158 132 132 L 105 132 L 82 178 C 76 183 65 183 65 178 Z M 105 112 L 132 112 C 148 112 158 100 153 84 C 148 68 132 56 110 56 C 98 56 92 68 92 80 Z" fill="url(#rxLogoGradient)" />
    
    <!-- Nested Script x -->
    <path d="M 174 122 C 185 112 202 100 212 100 C 223 100 218 112 207 122 L 185 144 C 196 155 212 166 223 166 C 234 166 223 178 212 178 C 196 178 180 160 168 144 L 152 166 C 142 178 136 166 147 155 Z" fill="url(#rxLogoGradient)" />

    <!-- Cursive Flow Text -->
    <text x="240" y="148" font-family="'Playfair Display', 'Georgia', 'Great Vibes', 'Brush Script MT', cursive, serif" font-size="108" font-style="italic" font-weight="900" fill="url(#rxLogoGradient)" letter-spacing="-3">Flow</text>

    <!-- Sweeping Calligraphic Underline Swoosh -->
    <path d="M 120 158 C 210 215 380 195 500 138 C 400 182 245 188 140 152 Z" fill="url(#rxSwooshGradient)" />
  </g>
</svg>
