<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RxFlow PWA - Key Generator Pro</title>
    <style>
        :root {
            --bg: #F5EDE0;
            --surface: #FFFFFF;
            --primary: #0078D7;
            --text: #2C2A24;
            --muted: #8E8C82;
            --shadow: 10px 10px 20px #E6DDD0, -10px -10px 20px #FFFFFF;
            --shadow-inset: inset 5px 5px 10px #E6DDD0, inset -5px -5px 10px #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: var(--bg);
            padding: 40px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { color: var(--primary); margin-bottom: 25px; font-size: 24px; font-weight: 800; }
        .input-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; margin-left: 10px; }
        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: var(--bg);
            box-shadow: var(--shadow-inset);
            font-size: 15px;
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 15px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 20px;
            background: var(--bg);
            box-shadow: var(--shadow-inset);
            word-break: break-all;
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            display: none;
            letter-spacing: 2px;
            user-select: all;
        }
        .copy-hint { font-size: 11px; color: var(--muted); margin-top: 10px; display: none; }
        .decode-card {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed #E6DDD0;
        }
        #decodeResult {
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RxFlow KeyGen Pro</h1>
    
    <div class="input-group">
        <label>CLIENT NAME</label>
        <input type="text" id="client" placeholder="e.g. DEMO CHEMIST" maxlength="40" autocomplete="off">
    </div>

    <div class="input-group">
        <label>CITY / LOCATION</label>
        <input type="text" id="city" placeholder="e.g. MUMBAI" maxlength="30" autocomplete="off">
    </div>

    <div class="input-group">
        <label>APP EXPIRY DATE</label>
        <input type="date" id="expiry">
    </div>

    <button class="btn" onclick="generate()">Generate 10-Digit Key</button>
    
    <div id="result" class="result"></div>
    <div id="hint" class="copy-hint">Key generated! Encodes Client Name, City, and Expiry Date.</div>

    <div class="decode-card">
        <div class="input-group">
            <label>REVERSE FETCH (Paste Key)</label>
            <input type="text" id="decodeInput" placeholder="Paste 10-digit key here..." oninput="decode()" maxlength="10">
        </div>
        <div id="decodeResult"></div>
    </div>
</div>

<script>
    // 72-character Base72 alphabet with small & large cases, numbers, and special characters
    const ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*()";
    const BASE = BigInt(ALPHABET.length);

    // 30-character lookup alphabet for encoding name/city text
    const NAME_CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ. -";

    function encodeText(text) {
        let val = 0n;
        const clean = text.toUpperCase().padEnd(8, ' ').slice(0, 8);
        for (let i = 0; i < 8; i++) {
            let charIdx = NAME_CHARS.indexOf(clean[i]);
            if (charIdx === -1) charIdx = 0;
            val = (val << 5n) | BigInt(charIdx);
        }
        return val; // 40 bits
    }

    function decodeText(val) {
        let name = "";
        for (let i = 0; i < 8; i++) {
            const charIdx = Number((val >> BigInt((7 - i) * 5)) & 31n);
            name += NAME_CHARS[charIdx] || ' ';
        }
        return name.trim();
    }

    function generate() {
        const client = document.getElementById('client').value.trim();
        const city = document.getElementById('city').value.trim();
        const expiryDate = document.getElementById('expiry').value;

        if (!client || !expiryDate) return alert("Please enter Client Name and Expiry Date");

        const combinedText = city ? `${client} ${city}` : client;

        const dateObj = new Date(expiryDate);
        const year = BigInt(dateObj.getFullYear() - 2024) & 63n; // 6 bits
        const month = BigInt(dateObj.getMonth() + 1) & 15n;    // 4 bits
        const day = BigInt(dateObj.getDate()) & 31n;          // 5 bits
        const datePart = (year << 9n) | (month << 5n) | day;  // 15 bits

        const namePart = encodeText(combinedText); // 40 bits
        
        // Combine: [Checksum: 6] [Date: 15] [Name: 40] = 61 bits
        let data = (datePart << 40n) | namePart;
        
        // Checksum
        const checksum = (data ^ 0x5B5B5B5Bn) % 64n;
        let combined = (checksum << 55n) | data;
        
        // Encode to 10 chars
        let key = "";
        for (let i = 0; i < 10; i++) {
            key = ALPHABET[Number(combined % BASE)] + key;
            combined /= BASE;
        }

        const resDiv = document.getElementById('result');
        resDiv.textContent = key;
        resDiv.style.display = 'block';
        document.getElementById('hint').style.display = 'block';
    }

    function decode() {
        const key = document.getElementById('decodeInput').value.trim();
        const output = document.getElementById('decodeResult');
        
        if (key.length !== 10) {
            output.textContent = "";
            output.style.background = "transparent";
            return;
        }

        try {
            let combined = 0n;
            for (let i = 0; i < key.length; i++) {
                const idx = ALPHABET.indexOf(key[i]);
                if (idx === -1) throw "Invalid character";
                combined = combined * BASE + BigInt(idx);
            }

            const checksum = (combined >> 55n) & 63n;
            const data = combined & 0x7FFFFFFFFFFFFFFn;
            const expectedChecksum = (data ^ 0x5B5B5B5Bn) % 64n;

            if (checksum !== expectedChecksum) {
                output.textContent = "❌ Invalid Key Signature";
                output.style.color = "#D32F2F";
                output.style.background = "#FFEBEE";
                return;
            }

            const datePart = (data >> 40n) & 0x7FFFn;
            const namePart = data & 0xFFFFFFFFFFn;

            const year = 2024 + Number((datePart >> 9n) & 63n);
            const month = Number((datePart >> 5n) & 15n);
            const day = Number(datePart & 31n);
            
            const decodedEntity = decodeText(namePart);

            output.innerHTML = `
                <div style="text-align:left;">
                    <b style="color:var(--muted)">ENTITY:</b> <span style="color:var(--primary)">${decodedEntity}</span><br>
                    <b style="color:var(--muted)">EXPIRY:</b> <span style="color:var(--primary)">${day}/${month}/${year}</span>
                </div>
            `;
            output.style.background = "#E8F5E9";
            output.style.color = "var(--primary)";
        } catch (e) {
            output.textContent = "❌ Malformed key";
            output.style.color = "#D32F2F";
            output.style.background = "#FFEBEE";
        }
    }
</script>

</body>
</html>
